<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="WatchTower — self-healing self-hosting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#fff7e6"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Framed border in brand ink -->
  <rect x="16" y="16" width="1168" height="598" rx="28" fill="none" stroke="#1f2937" stroke-width="6"/>

  <!-- Logo mark -->
  <g transform="translate(80 72)">
    <rect x="0" y="0" width="104" height="104" rx="24" fill="#fde68a" stroke="#1f2937" stroke-width="5"/>
    <text x="52" y="72" text-anchor="middle" font-family="'DM Sans','Inter',system-ui,sans-serif" font-size="52" font-weight="800" fill="#b91c1c">Wt</text>
  </g>
  <text x="208" y="118" font-family="'DM Sans','Inter',system-ui,sans-serif" font-size="40" font-weight="800" fill="#101828">WatchTower</text>
  <text x="208" y="158" font-family="'Space Mono',monospace" font-size="20" font-weight="400" fill="#505a69">self-healing self-hosting</text>

  <!-- Headline -->
  <text x="80" y="300" font-family="'DM Sans','Inter',system-ui,sans-serif" font-size="66" font-weight="800" fill="#101828">Deploy from GitHub to a</text>
  <text x="80" y="378" font-family="'DM Sans','Inter',system-ui,sans-serif" font-size="66" font-weight="800" fill="#101828">computer you already own.</text>

  <!-- Differentiator line -->
  <text x="80" y="456" font-family="'DM Sans','Inter',system-ui,sans-serif" font-size="34" font-weight="500" fill="#7f1d1d">When a deploy breaks, it fixes itself.</text>

  <!-- Feature pills -->
  <g font-family="'Space Mono',monospace" font-size="20" font-weight="700">
    <g transform="translate(80 512)">
      <rect x="0" y="0" width="228" height="52" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
      <text x="114" y="34" text-anchor="middle" fill="#101828">Rootless Podman</text>
    </g>
    <g transform="translate(328 512)">
      <rect x="0" y="0" width="252" height="52" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
      <text x="126" y="34" text-anchor="middle" fill="#101828">Private via Tailscale</text>
    </g>
    <g transform="translate(600 512)">
      <rect x="0" y="0" width="168" height="52" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
      <text x="84" y="34" text-anchor="middle" fill="#101828">No VPS bill</text>
    </g>
    <g transform="translate(788 512)">
      <rect x="0" y="0" width="196" height="52" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="4"/>
      <text x="98" y="34" text-anchor="middle" fill="#7f1d1d">Open source</text>
    </g>
  </g>
</svg>
