[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower-podman"
description = "Podman update and multi-node website deployment automation"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
dynamic = ["version"]
authors = [
  { name = "WatchTower Contributors" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Systems Administration",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS"
]
# Keep this list in sync with requirements.txt. requirements.txt holds
# the pinned versions used by the dev clone / CI / Docker image; the
# bounds here are looser so PyPI / pipx consumers' resolvers have room
# to move. Anything imported by the runtime must appear here, otherwise
# `pipx install watchtower-podman` produces a partial install that
# crashes at first use (regression that bit 1.6.x — see CHANGELOG 1.6.3).
dependencies = [
  # Core API
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  # Database + migrations
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.0",
  # Crypto / secret storage
  "cryptography>=42.0.0",
  # Misc utilities
  "pyyaml>=6.0",
  "apscheduler>=3.10.0",
  "requests>=2.28.0",
  "fabric>=3.2.0",
  "httpx>=0.25.0",
  # Build queue (RQ + Redis); falls back to in-process when REDIS_URL unset
  "redis>=5.0.0",
  "rq>=1.16.0",
  # LLM agent — talks to any OpenAI-compatible endpoint
  "openai>=1.50.0",
  # Rate limiting
  "slowapi>=0.1.9",
  # Container update mode (Podman SDK has Linux wheels only)
  "podman>=4.0.0; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/sinhaankur/WatchTower"
Documentation = "https://github.com/sinhaankur/WatchTower#readme"
Issues = "https://github.com/sinhaankur/WatchTower/issues"
Source = "https://github.com/sinhaankur/WatchTower"

[project.scripts]
watchtower = "watchtower.cli:main"
watchtower-deploy = "watchtower.deploy_server:main"
watchtower-package = "watchtower.package_builder:main"
watchtower-mcp = "watchtower.mcp_server:main"

# Optional dependency sets. `mcp` pulls in a newer starlette/pydantic
# than the core API tolerates, so it's gated behind an extra — users
# who want the MCP server install with `pip install
# watchtower-podman[mcp]`. The default install stays compatible with
# the rest of the stack.
[project.optional-dependencies]
mcp = [
  "mcp>=1.0,<2.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "watchtower.__version__"}

[tool.setuptools.packages.find]
# Match watchtower + any subpackage, but exclude the two underscore-prefixed
# data dirs that scripts/build-wheel.sh stages right before wheel build
# (alembic migrations and the React SPA bundle). They ARE shipped via
# package-data below — we just don't want them treated as importable
# Python subpackages, which would clash with the real `alembic` PyPI
# package and pollute `dir(watchtower)`.
include = ["watchtower*"]
exclude = ["watchtower._alembic*", "watchtower._web_dist*"]

[tool.setuptools.package-data]
# Populated only at wheel-build time by scripts/build-wheel.sh, which
# copies the repo-root `alembic/` and `web/dist/` into
# `watchtower/_alembic/` and `watchtower/_web_dist/`. The dev clone
# doesn't have these on disk; the loader falls back to the dev-clone
# paths for editable installs. See watchtower/database.py:_alembic_config
# and watchtower/api/__init__.py:_resolve_web_dist for the resolver order.
#
# Why this matters: pre-1.16.1 wheels shipped without the alembic dir
# AND without web/dist, so `pip install watchtower-podman` crashed at
# startup with RuntimeError + then served a 61-byte JSON fallback on /.
# Documented in .claude/memory/pypi_wheel_packaging_gap.md.
watchtower = ["_alembic/**/*", "_web_dist/**/*"]


[tool.pytest.ini_options]
# Scope test discovery to our tests/ tree. Without this, `pytest` from
# the repo root (e.g. release.sh and other CI helpers) walks into
# desktop/python-bundle/ — the bundled Python tree built by
# electron-builder for packaged installs — and tries to collect the
# vendored sqlalchemy/alembic test suites that live under there. Those
# modules' files conflict with the same modules in .venv/, producing
# 22+ collection errors and aborting the run. Pinning testpaths fixes
# both `pytest` (no arg) and `pytest -q` invocations.
testpaths = ["tests"]
norecursedirs = [
    "desktop/python-bundle",
    "desktop/dist",
    "desktop/node_modules",
    "web/node_modules",
    "web/dist",
    ".venv",
    "node_modules",
]
