name: Publish Python Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Set up Node (for SPA build that ends up in the wheel)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build distributions (stages alembic/ + web/dist/ into the package)
        # Calls scripts/build-wheel.sh which copies the migrations and
        # SPA bundle into the package root before `python -m build`, and
        # verifies the resulting wheel actually contains them. Without
        # this step the wheel ships with neither — a regression that
        # bit every PyPI install through 1.16.0 (see
        # .claude/memory/pypi_wheel_packaging_gap.md).
        run: ./scripts/build-wheel.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
