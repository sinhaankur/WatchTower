name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        # Build with NO cache. A security scan MUST reflect the dependency
        # versions that actually ship — reusing the GHA layer cache
        # (cache-from: type=gha) made this nondeterministic: when the cached
        # pip layer predated a security pin, Trivy reported the OLD versions
        # (e.g. urllib3 2.7.0 after we'd floored it to 2.8.0) and the gate
        # failed on vulnerabilities that were already fixed in source — or
        # worse, could pass on a stale layer that hides a real one. The ~3-5
        # min rebuild is the right cost for a gate whose whole job is to tell
        # the truth about what we ship. `load: true` keeps the image
        # addressable for trivy below.
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: watchtower:security-scan
          no-cache: true

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: watchtower:security-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
