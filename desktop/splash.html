<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchTower</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      /* Slate-50 — matches web/App.css so the Electron → web hand-off
         no longer pivots aesthetic in the user's face. The old cream
         #fbf6ea is gone. */
      background: #f8fafc;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0;
    }

    /* Logo mark — soft drop shadow, no hard block shadow */
    .logo-wrap {
      position: relative;
      width: 108px;
      height: 108px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-mark {
      position: relative;
      width: 96px;
      height: 96px;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(15,23,42,0.08));
    }

    /* Name */
    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }
    .app-tagline {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 36px;
    }

    /* Status line — sans-serif slate, no monospace shouting */
    .status {
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      letter-spacing: 0;
      margin-bottom: 14px;
      min-height: 18px;
      transition: opacity 0.3s;
    }

    /* Progress bar — track is soft slate-200 with a subtle inner border
       (no hard 1.5px black outline); fill is brand red. Indeterminate
       shimmer animation runs until __setStatus delivers real progress. */
    .bar-track {
      width: 240px;
      height: 5px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #b91c1c;
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    /* Indeterminate sweep used until first __setStatus call. */
    .bar-fill.indeterminate {
      width: 35%;
      animation: bar-sweep 1.4s ease-in-out infinite;
    }
    @keyframes bar-sweep {
      0%   { transform: translateX(-130%); }
      100% { transform: translateX(330%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar-fill.indeterminate { animation: none; width: 100%; }
    }

    /* Animated dots */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .dots span {
      display: inline-block;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    /* Version badge */
    .version {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
    }

    /* Slow-launch hint + cancel button — hidden by default, JS shows
       them only after 30 s of waiting so a normal-speed launch never
       sees them. */
    .hint {
      margin-top: 16px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      max-width: 280px;
      opacity: 0;
      transition: opacity 0.3s;
      -webkit-app-region: no-drag;
    }
    .hint.visible { opacity: 1; }

    .cancel-btn {
      margin-top: 10px;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: #b91c1c;
      background: white;
      border: 1.5px solid #b91c1c;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s, background 0.15s;
      -webkit-app-region: no-drag;
      pointer-events: none;
    }
    .cancel-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .cancel-btn:hover { background: #fee2e2; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="logo-wrap">
      <!-- Inlined wt-logo.svg. The previous `<img src="../assets/wt-logo.svg">`
           worked in the dev clone but 404'd in packaged builds because
           desktop/package.json's `files` array only includes main.js,
           preload.js, and splash.html — `../assets/` isn't shipped into
           the .app bundle. Inlining keeps the splash logo visible without
           changing what gets packaged. -->
      <svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WatchTower logo">
        <rect x="2" y="2" width="60" height="60" rx="11" fill="#fde68a" stroke="#0f172a" stroke-width="4"/>
        <text x="32" y="39" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#b91c1c">Wt</text>
      </svg>
    </div>

    <div class="app-name">WatchTower</div>
    <div class="app-tagline">Deployment control plane</div>

    <div class="status" id="status">
      Starting WatchTower<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <div class="bar-track">
      <div class="bar-fill indeterminate" id="bar"></div>
    </div>

    <div class="hint" id="hint">
      Taking longer than usual — first-launch database setup can be slow on some disks. The app will be ready shortly.
    </div>
    <button class="cancel-btn" id="cancel" type="button">Cancel and quit</button>
  </div>

  <!-- Version label is populated by main.js's createSplash() via
       webContents.executeJavaScript after dom-ready. Empty default so a
       stale build doesn't render a wrong version while the JS hasn't
       run yet. (The previous hardcoded "v1.2.2" stayed wrong across
       every release between 1.2.2 and 1.5.12.) -->
  <div class="version" id="version"></div>

  <script>
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('bar');

    // The bar starts in indeterminate-shimmer mode (defined in CSS via
    // .indeterminate). Previously we also scripted a fake 5-step
    // animation that pretended to know what stage the backend was at,
    // which lied to the user on slow disks (stuck at 90% with no real
    // info). Indeterminate shimmer is honest: "I'm working on it, and
    // I'll switch to a real percentage as soon as I have one."
    //
    // window.__setStatus(msg, pct) is the only authoritative status
    // path — main.js calls it via webContents.executeJavaScript and
    // that's when we flip from indeterminate → determinate.
    window.__setStatus = (msg, pct) => {
      statusEl.innerHTML = msg + ' <span class="dots"><span>.</span><span>.</span><span>.</span></span>';
      if (typeof pct === 'number') {
        bar.classList.remove('indeterminate');
        bar.style.width = pct + '%';
      }
    };

    // After 30s of waiting, surface the slow-launch hint and the
    // Cancel button. Most launches finish in under 10s; a 30s hold is
    // a clear signal that something's off and the user deserves an
    // escape hatch.
    setTimeout(() => {
      const hint = document.getElementById('hint');
      const cancel = document.getElementById('cancel');
      if (hint) hint.classList.add('visible');
      if (cancel) cancel.classList.add('visible');
    }, 30000);

    // Cancel just closes the splash window. main.js listens for the
    // splash 'closed' event and treats it as a launch cancellation
    // when the main window hasn't appeared yet — backend gets killed
    // and the app quits cleanly.
    document.getElementById('cancel').addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
